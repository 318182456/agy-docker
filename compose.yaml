name: agy-docker
services:
  app:
    image: ghcr.io/318182456/agy-docker:${IMAGE_TAG:-0.1.10}
    hostname: agy-docker
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-18861}:18861"
    environment:
      PORT: "18861"
      DATA_DIR: /data
      NO_PROXY: ${NO_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-${HTTP_PROXY:-}}
    volumes:
      - ${DATA_PATH:-/volume1/docker/agy-data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpu_shares: 512
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
