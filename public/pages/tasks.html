<div class="split-layout"><section class="card"><h2>执行文本任务</h2><p class="muted">真实执行官方 CLI，结果和用量在下方显示。</p><form id="taskForm"><div class="form-grid"><label>执行账号<select id="taskAccount"><option value="">自动轮询</option></select></label><label>模型<select id="taskModel"><option value="">沿用 CLI 默认模型</option></select></label></div><label>任务内容<textarea id="prompt" rows="9" required placeholder="输入需要处理的文本任务"></textarea></label><div class="toolbar"><button id="sendTask">发送任务</button><button id="cancelTask" type="button" class="secondary" hidden>取消任务</button></div></form><p id="taskFeedback" class="feedback" role="status"></p></section><section class="card"><h2>执行结果</h2><div id="taskResult" class="result" hidden><p id="taskMeta" class="muted"></p><pre id="answer"></pre><button id="copyAnswer" class="secondary small">复制结果</button></div><p id="taskEmpty" class="empty">任务完成后在这里显示结果。</p></section></div>
