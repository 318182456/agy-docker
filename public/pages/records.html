<section class="card"><div class="section-heading"><div><h2>请求记录</h2><p class="muted">仅保存元数据。可通过请求 ID 对照 Docker 运行日志。</p></div><div class="toolbar"><a id="exportRecords" class="button secondary small" href="/api/records/export">导出匹配 JSON</a><button id="showClearRecords" class="secondary danger small">清理匹配记录</button></div></div>
<form id="recordFilters" class="filters record-filters"><label>账号<select id="recordAccount"></select></label><label>API 密钥<select id="recordKey"></select></label><label>模型<input id="recordModel" placeholder="模型 ID 包含"/></label><label>结果<select id="recordResult"><option value="all">全部</option><option value="success">成功</option><option value="error">失败 / 取消</option></select></label><label>状态码<input id="recordCode" placeholder="如 429、5xx"/></label><label>开始（本地时间）<input id="recordFrom" type="datetime-local"/></label><label>结束（本地时间）<input id="recordTo" type="datetime-local"/></label><label>每页<select id="recordSize"><option>10</option><option selected>20</option><option>50</option><option>100</option></select></label><div class="filter-actions"><button>查询</button><button id="resetRecordFilters" type="button" class="secondary">重置</button></div></form>
<div id="recordSummary" class="summary-strip"></div>
<div id="clearRecordsPanel" class="inline-panel danger-panel" hidden><p id="clearRecordsText"></p><button id="confirmClearRecords" class="danger">确认清理</button><button id="cancelClearRecords" class="secondary">取消</button></div>
<p id="recordFeedback" class="feedback" role="status"></p>
<div class="scroll"><table><thead><tr><th>时间（北京）</th><th>账号 / 模型</th><th>API 密钥</th><th>结果 / 阶段</th><th>耗时 / Token</th><th>请求 ID</th><th></th></tr></thead><tbody id="recordRows"></tbody></table></div>
<div class="table-footer"><span id="recordPagination" class="muted"></span><div class="toolbar"><button id="recordsPrev" class="secondary small">上一页</button><button id="recordsNext" class="secondary small">下一页</button></div></div>
</section>
