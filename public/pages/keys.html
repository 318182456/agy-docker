<section class="card"><div class="section-heading"><div><h2>项目密钥 <span id="keyCount" class="badge"></span></h2><p class="muted">不同客户端使用独立密钥，停用和删除后阻止后续调用。总密钥继续兼容。</p></div><div class="toolbar"><button id="showImportKeys" class="secondary small">导入 New API</button><button id="showCreateKey" class="small">创建密钥</button></div></div>
<div id="keyCreatePanel" class="inline-panel" hidden><h3>创建项目密钥</h3><form id="keyCreateForm" class="form-grid"><label>名称<input id="newKeyName" maxlength="100" required placeholder="例如 MoviePilot"/></label><label>到期（本地时间，可留空）<input id="newKeyExpiry" type="datetime-local"/></label><label class="full-width">现有密钥（可留空自动生成）<input id="newKeyValue" type="password" autocomplete="off" placeholder="可直接沿用原客户端的密钥"/></label><div class="toolbar full-width"><button>创建</button><button type="button" id="cancelCreateKey" class="secondary">取消</button></div></form></div>
<div id="keyImportPanel" class="inline-panel" hidden><h3>导入 New API 密钥</h3><form id="keyImportForm"><label>每行“名称 TAB 密钥”，或 JSON 数组<textarea id="keyImportText" rows="5" maxlength="200000" required placeholder="项目名称&#9;sk-原密钥" spellcheck="false"></textarea></label><div class="toolbar"><button>导入</button><button type="button" id="cancelImportKeys" class="secondary">取消</button></div></form></div>
<p id="keyFeedback" class="feedback" role="status"></p>
<div class="filters"><label>搜索密钥<input id="keySearch" type="search" placeholder="项目名称"/></label><label>状态<select id="keyStatus"><option value="">全部</option><option value="active">可用</option><option value="disabled">已停用</option><option value="expired">已到期</option></select></label></div>
<div class="scroll"><table><thead><tr><th>名称</th><th>累计报告用量</th><th>密钥标识</th><th>状态</th><th>到期（北京）</th><th>操作</th></tr></thead><tbody id="keyRows"></tbody></table></div>
<p class="muted note">项目密钥统计从创建或导入后开始；总密钥从本功能启用后开始。未报告的 Token 不估算。密钥保存在 NAS 数据目录中，仅管理员可查看；无到期时间表示永不过期。删除密钥不删除历史请求记录。</p>
</section>
